<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>temp1 Machine Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9; /* Light background */
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        h1 {
            color: #4CAF50; /* A friendly green color */
            font-size: 2em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.1em;
            margin-bottom: 2em;
            line-height: 1.6;
        }
        .links a {
            display: inline-block;
            background-color: #007BFF; /* A standard blue */
            color: white;
            padding: 12px 25px;
            margin: 10px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .links a:hover {
            background-color: #0056b3;
        }
        .nodered-link {
            background-color: #CC202A; /* Node-RED's official color */
        }
        .nodered-link:hover {
            background-color: #a71822;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to temp1 Machine</h1>
        <p>This server is the dedicated host for the **temp1** project, providing data logging and control services.</p>

        <div class="links">
            <a href="https://github.com/chrowe/temp1" target="_blank">
                View Project Source (GitHub)
            </a>
	    <a href="http://temp1.local:1880" class="nodered-link">
                Access Node-RED Web GUI
            </a>
        </div>
        <p style="margin-top: 30px; font-size: 0.9em; color: #777;">
            (Remember to replace YOUR_PI_IP in the Node-RED link with your Raspberry Pi's actual IP address.)
        </p>
    </div>
</body>
</html>
